version: 2

metrics:

  # ═══════════════════════════════════════════════════════════════════════
  # FILTERED METRIC  (Databricks: FILTER clause)
  # ═══════════════════════════════════════════════════════════════════════

  - name: return_transactions
    type: simple
    label: "Return Transactions"
    description: "Distinct transactions that were returns (return_flag = Y)"
    type_params:
      measure: return_transaction_count
    filter:
      - "{{ Dimension('transaction__return_flag') }} = 'Y'"

  # ═══════════════════════════════════════════════════════════════════════
  # DERIVED METRICS  (Databricks: Composed via MEASURE())
  # ═══════════════════════════════════════════════════════════════════════

  - name: gross_margin
    type: derived
    label: "Gross Margin"
    description: "Gross margin = net revenue minus COGS"
    type_params:
      expr: revenue - cogs
      metrics:
        - name: total_net_revenue
          offset_window: null
          alias: revenue
        - name: total_cogs
          offset_window: null
          alias: cogs

  - name: gross_margin_pct
    type: derived
    label: "Gross Margin %"
    description: "Gross margin as a percentage of net revenue"
    type_params:
      expr: "(revenue - cogs) / nullif(revenue, 0) * 100"
      metrics:
        - name: total_net_revenue
          alias: revenue
        - name: total_cogs
          alias: cogs

  - name: avg_order_value
    type: derived
    label: "Avg Order Value"
    description: "Average revenue per transaction"
    type_params:
      expr: "revenue / nullif(txn_count, 0)"
      metrics:
        - name: total_net_revenue
          alias: revenue
        - name: transaction_count
          alias: txn_count

  - name: avg_selling_price
    type: derived
    label: "Avg Selling Price"
    description: "Average selling price per unit"
    type_params:
      expr: "revenue / nullif(qty, 0)"
      metrics:
        - name: total_net_revenue
          alias: revenue
        - name: total_quantity
          alias: qty

  - name: discount_rate
    type: ratio
    label: "Discount Rate"
    description: "Discount as a share of gross revenue"
    type_params:
      numerator: total_discount
      denominator: total_gross_revenue

  - name: return_rate
    type: ratio
    label: "Return Rate"
    description: "Share of transactions that are returns"
    type_params:
      numerator: return_transactions
      denominator: transaction_count

  # ═══════════════════════════════════════════════════════════════════════
  # CUMULATIVE / WINDOW METRICS  (Databricks: window measures)
  # ═══════════════════════════════════════════════════════════════════════

  # --- Trailing 7-day revenue (rolling window) ---
  - name: trailing_7d_revenue
    type: cumulative
    label: "Trailing 7-Day Revenue"
    description: "Rolling 7-day trailing net revenue"
    type_params:
      measure: total_net_revenue
      window: 7 days

  # --- Trailing 7-day unique customers ---
  - name: trailing_7d_customers
    type: cumulative
    label: "Trailing 7-Day Customers"
    description: "Distinct customers in trailing 7-day window"
    type_params:
      measure: unique_customers
      window: 7 days

  # --- Cumulative (running total) revenue ---
  - name: cumulative_revenue
    type: cumulative
    label: "Cumulative Revenue"
    description: "Running total of net revenue over all time"
    type_params:
      measure: total_net_revenue

  # --- Year-to-date revenue ---
  - name: ytd_revenue
    type: cumulative
    label: "YTD Revenue"
    description: "Year-to-date cumulative net revenue, resets each year"
    type_params:
      measure: total_net_revenue
      grain_to_date: year

  # ═══════════════════════════════════════════════════════════════════════
  # PERIOD-OVER-PERIOD (Databricks: current_day / previous_day + composed)
  # ═══════════════════════════════════════════════════════════════════════

  - name: day_over_day_revenue_growth
    type: derived
    label: "Day-over-Day Revenue Growth %"
    description: "Day-over-day revenue growth percentage using offset_window"
    type_params:
      expr: "(current_rev - prior_rev) / nullif(prior_rev, 0) * 100"
      metrics:
        - name: total_net_revenue
          alias: current_rev
        - name: total_net_revenue
          offset_window: 1 day
          alias: prior_rev
