version: 2

saved_queries:
  - name: daily_sales_summary
    description: "Daily sales KPIs by store region and product category"
    query_params:
      metrics:
        - total_net_revenue
        - total_cogs
        - gross_margin
        - gross_margin_pct
        - transaction_count
        - avg_order_value
      group_by:
        - TimeDimension('transaction__transaction_date', 'day')
        - Dimension('store__region_name')
        - Dimension('product__category_name')

  - name: weekly_performance
    description: "Weekly performance with trailing and cumulative metrics"
    query_params:
      metrics:
        - total_net_revenue
        - trailing_7d_revenue
        - cumulative_revenue
        - unique_customers
        - trailing_7d_customers
      group_by:
        - TimeDimension('transaction__transaction_date', 'week')

  - name: ytd_revenue_by_region
    description: "Year-to-date revenue broken down by region"
    query_params:
      metrics:
        - ytd_revenue
        - total_net_revenue
      group_by:
        - TimeDimension('transaction__transaction_date', 'month')
        - Dimension('store__region_name')

  - name: discount_and_return_analysis
    description: "Discount rate and return rate by product division"
    query_params:
      metrics:
        - total_gross_revenue
        - total_discount
        - discount_rate
        - return_transactions
        - return_rate
      group_by:
        - TimeDimension('transaction__transaction_date', 'month')
        - Dimension('product__division_name')
