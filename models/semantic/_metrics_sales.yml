version: 2

metrics:

  # ============================================================================
  #  SIMPLE METRICS  (atomic measures)
  # ============================================================================

  - name: total_net_revenue
    label: Total Net Revenue
    description: Total net revenue in USD across all transactions
    type: simple
    type_params:
      measure: net_revenue_usd_sum

  - name: total_gross_revenue
    label: Total Gross Revenue
    description: Total gross revenue before discounts
    type: simple
    type_params:
      measure: gross_revenue_sum

  - name: total_cogs
    label: Total COGS
    description: Total cost of goods sold
    type: simple
    type_params:
      measure: cogs_sum

  - name: total_discount
    label: Total Discount
    description: Total discount amount given
    type: simple
    type_params:
      measure: discount_sum

  - name: total_quantity
    label: Total Units Sold
    description: Total units sold
    type: simple
    type_params:
      measure: quantity_sum

  - name: transaction_count
    label: Transaction Count
    description: Distinct number of transactions
    type: simple
    type_params:
      measure: txn_count

  - name: unique_customers
    label: Unique Customers
    description: Distinct customer count
    type: simple
    type_params:
      measure: customer_count

  # --- Simple metric with filter (WHERE equivalent) ---
  - name: return_transactions
    label: Return Transactions
    description: Transactions that were returns (return_flag = Y)
    type: simple
    type_params:
      measure: txn_count
    filter: |
      {{ Dimension('transaction__return_flag') }} = 'Y'


  # ============================================================================
  #  DERIVED METRICS  (equivalent to Databricks MEASURE() composed measures)
  # ============================================================================

  - name: gross_margin
    label: Gross Margin
    description: "Gross margin = net revenue minus COGS"
    type: derived
    type_params:
      expr: total_net_revenue - total_cogs
      metrics:
        - name: total_net_revenue
        - name: total_cogs

  - name: gross_margin_pct
    label: Gross Margin %
    description: Gross margin as a percentage of net revenue
    type: derived
    type_params:
      expr: "((total_net_revenue - total_cogs) / nullif(total_net_revenue, 0)) * 100"
      metrics:
        - name: total_net_revenue
        - name: total_cogs

  - name: avg_order_value
    label: Avg Order Value
    description: Average revenue per transaction
    type: derived
    type_params:
      expr: "total_net_revenue / nullif(transaction_count, 0)"
      metrics:
        - name: total_net_revenue
        - name: transaction_count

  - name: avg_selling_price
    label: Avg Selling Price
    description: Average selling price per unit
    type: derived
    type_params:
      expr: "total_net_revenue / nullif(total_quantity, 0)"
      metrics:
        - name: total_net_revenue
        - name: total_quantity

  - name: discount_rate
    label: Discount Rate
    description: Discount as a share of gross revenue
    type: derived
    type_params:
      expr: "total_discount / nullif(total_gross_revenue, 0)"
      metrics:
        - name: total_discount
        - name: total_gross_revenue

  - name: return_rate
    label: Return Rate
    description: Share of transactions that are returns
    type: derived
    type_params:
      expr: "cast(return_transactions as double) / nullif(cast(transaction_count as double), 0)"
      metrics:
        - name: return_transactions
        - name: transaction_count


  # ============================================================================
  #  CUMULATIVE METRICS  (equivalent to Databricks window measures)
  # ============================================================================

  # --- Trailing 7-day revenue ---
  - name: trailing_7d_revenue
    label: Trailing 7-Day Revenue
    description: Rolling 7-day net revenue
    type: cumulative
    type_params:
      measure: net_revenue_usd_sum
      window: 7 days

  # --- Trailing 7-day unique customers ---
  - name: trailing_7d_customers
    label: Trailing 7-Day Customers
    description: Distinct customers in trailing 7-day window
    type: cumulative
    type_params:
      measure: customer_count
      window: 7 days

  # --- Cumulative (running total) revenue — no window = all time ---
  - name: cumulative_revenue
    label: Cumulative Revenue
    description: Running total of net revenue over all time
    type: cumulative
    type_params:
      measure: net_revenue_usd_sum

  # --- Year-to-date revenue (resets each year) ---
  - name: ytd_revenue
    label: YTD Revenue
    description: Year-to-date cumulative net revenue, resets each calendar year
    type: cumulative
    type_params:
      measure: net_revenue_usd_sum
      grain_to_date: year


  # ============================================================================
  #  PERIOD-OVER-PERIOD  (current/previous day + DoD growth)
  # ============================================================================
  # current/trailing concepts for period-over-period comparisons.

  - name: day_over_day_revenue_growth
    label: Day-over-Day Growth %
    description: >
      Day-over-day revenue growth percentage.
      Compares current period revenue to previous period using offset_window.
    type: derived
    type_params:
      expr: "(current_rev - prev_rev) / nullif(prev_rev, 0) * 100"
      metrics:
        - name: total_net_revenue
          alias: current_rev
        - name: total_net_revenue
          offset_window: 1 day
          alias: prev_rev
