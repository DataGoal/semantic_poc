version: 2

semantic_models:

  # ── Store dimension ─────────────────────────────────────────────
  - name: dim_store_semantic
    description: Store dimension with geographic and format attributes.
    model: ref('stg_dim_store')

    entities:
      - name: store
        type: primary
        expr: store_sk

    dimensions:
      - name: store_name
        type: categorical
        label: Store Name
        description: Name of the store / location

      - name: region_name
        type: categorical
        label: Region
        description: Geographic region of the store

      - name: country_name
        type: categorical
        label: Country
        description: Country of the store

      - name: store_format
        type: categorical
        label: Store Format
        description: Format of the store (e.g. Factory, Inline, Digital)

      - name: state_province_name
        type: categorical
        label: State / Province

      - name: city
        type: categorical
        label: City

      - name: is_active
        type: categorical
        label: Is Active

  # ── Product dimension ───────────────────────────────────────────
  - name: dim_product_semantic
    description: Product dimension with hierarchy and classification attributes.
    model: ref('stg_dim_product')

    entities:
      - name: product
        type: primary
        expr: product_sk

    dimensions:
      - name: division_name
        type: categorical
        label: Division
        description: Business division (e.g. Apparel, Footwear)

      - name: category_name
        type: categorical
        label: Product Category
        description: Product category

      - name: subcategory_name
        type: categorical
        label: Subcategory

      - name: product_name
        type: categorical
        label: Product Name

      - name: gender_target
        type: categorical
        label: Gender Target
        description: Target gender for the product

      - name: age_group
        type: categorical
        label: Age Group

      - name: sport_occasion
        type: categorical
        label: Sport / Occasion

      - name: is_hero_product
        type: categorical
        label: Hero Product Flag

  # ── Customer dimension ──────────────────────────────────────────
  - name: dim_customer_semantic
    description: Customer dimension with loyalty and segmentation attributes.
    model: ref('stg_dim_customer')

    entities:
      - name: customer
        type: primary
        expr: customer_sk

    dimensions:
      - name: loyalty_tier
        type: categorical
        label: Loyalty Tier

      - name: customer_segment
        type: categorical
        label: Customer Segment

      - name: gender_code
        type: categorical
        label: Customer Gender

      - name: country_code
        type: categorical
        label: Customer Country

      - name: lifetime_value_band
        type: categorical
        label: Lifetime Value Band

      - name: acquisition_channel
        type: categorical
        label: Acquisition Channel
